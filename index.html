<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aplikasi Plisir Gizi 80x50 - RSUD Suryah Khairuddin</title>
    <script src="https://cdn.tailwindcss.com/"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- PUSTAKA UNTUK EKSPOR PDF LURING PRESISI -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;850&family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        h1, h2, h3, .font-brand { font-family: 'Nunito', sans-serif; }
        
        /* GAYA FISIK KOTAK LABEL: DIKUNCI MATI PADA UKURAN 80mm x 50mm */
        .label-print-block {
            width: 80mm;
            height: 50mm;
            min-width: 80mm;
            min-height: 50mm;
            box-sizing: border-box;
            padding: 3mm 4.5mm;
            background: #ffffff;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            border: 1px solid #000;
        }

        /* ATURAN HALAMAN SAAT DICETAK KE PRINTER THERMAL (KEBAL GAP KOSONG) */
        @media print {
            body * { visibility: hidden; }
            #area-cetak-massal-thermal, #area-cetak-massal-thermal * { visibility: visible; }
            #area-cetak-massal-thermal {
                position: absolute;
                left: 0;
                top: 0;
                width: 80mm;
                margin: 0 !important;
                padding: 0 !important;
                border: none;
                box-shadow: none;
            }
            .label-print-block {
                border: none !important;
                box-shadow: none !important;
                page-break-after: always;
                break-after: page;
                margin: 0 !important;
            }
            .label-print-block:last-child {
                page-break-after: avoid;
                break-after: avoid;
            }
            @page {
                size: 80mm 50mm;
                margin: 0mm !important;
            }
        }
    </style>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen flex flex-col pb-8">

    <div id="toast-container" class="fixed top-5 right-5 z-50 flex flex-col gap-3"></div>

    <!-- HEADER MENU -->
    <header class="bg-teal-800 text-white px-6 py-4 shadow-md">
        <div class="max-w-6xl mx-auto flex justify-between items-center">
            <div class="flex items-center gap-3">
                <div class="p-2 bg-teal-700 rounded-xl">
                    <i data-lucide="printer" class="w-6 h-6 text-white"></i>
                </div>
                <div>
                    <h1 class="text-base font-black tracking-tight leading-none uppercase">Sistem Plisir Mandiri (80x50)</h1>
                    <span class="text-[10px] text-teal-300 font-bold uppercase tracking-wider">RSUD SURYAH KHAIRUDDIN</span>
                </div>
            </div>
            <span class="text-xs font-bold bg-teal-900/50 px-3 py-1.5 rounded-full border border-teal-700/60">Standalone Printer</span>
        </div>
    </header>

    <main class="max-w-6xl mx-auto px-4 mt-6 grid grid-cols-1 lg:grid-cols-12 gap-6 w-full flex-1">
        
        <!-- KOLOM KIRI: FORM REGISTRASI & TABEL MANIFES (LEBAR 7 KOLOM) -->
        <div class="lg:col-span-7 space-y-6">
            
            <!-- FORM INPUT PASIEN -->
            <div class="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm space-y-4">
                <h3 class="font-extrabold text-slate-800 text-sm uppercase tracking-wider pb-2 border-b flex items-center gap-1.5">
                    <i data-lucide="user-plus" class="w-4.5 h-4.5 text-teal-600"></i> <span id="form-title">Tambah Pasien Baru</span>
                </h3>
                
                <form id="form-pasien" onsubmit="handleSimpanPasien(event)" class="space-y-4 text-xs font-semibold">
                    <input type="hidden" id="edit-mode" value="false">
                    <input type="hidden" id="edit-old-rm" value="">

                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div>
                            <label class="block text-slate-500 uppercase tracking-wider mb-1.5">No. Rekam Medis (RM) *</label>
                            <input type="text" id="inp-rm" required class="w-full px-3.5 py-2.5 border rounded-xl outline-none focus:ring-2 focus:ring-teal-500" placeholder="RM-0000">
                        </div>
                        <div>
                            <label class="block text-slate-500 uppercase tracking-wider mb-1.5">Nama Lengkap Pasien *</label>
                            <input type="text" id="inp-nama" required class="w-full px-3.5 py-2.5 border rounded-xl outline-none focus:ring-2 focus:ring-teal-500" placeholder="Ahmad Subarjo">
                        </div>
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                        <div class="md:col-span-2">
                            <label class="block text-slate-500 uppercase tracking-wider mb-1.5">Ruang Rawat (Bangsal/Kelas/Bed) *</label>
                            <input type="text" id="inp-ruang" required class="w-full px-3.5 py-2.5 border rounded-xl outline-none focus:ring-2 focus:ring-teal-500" placeholder="Penyakit Dalam (VIP B / Bed 1)">
                        </div>
                        <div>
                            <label class="block text-slate-500 uppercase tracking-wider mb-1.5">Tanggal Lahir Pasien *</label>
                            <input type="date" id="inp-tgl-lahir" required class="w-full px-3.5 py-2.5 border rounded-xl outline-none focus:ring-2 focus:ring-teal-500">
                        </div>
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                        <div>
                            <label class="block text-slate-500 uppercase tracking-wider mb-1.5">Bentuk Makanan *</label>
                            <select id="inp-bentuk" required class="w-full px-3.5 py-2.5 border rounded-xl outline-none bg-white">
                                <option value="Makanan Biasa">Makanan Biasa (Nasi)</option>
                                <option value="Makanan Lunak" selected>Makanan Lunak (Bubur/Tim)</option>
                                <option value="Makanan Saring">Makanan Saring</option>
                                <option value="Makanan Cair">Makanan Cair (Enteral)</option>
                            </select>
                        </div>
                        <div class="md:col-span-2">
                            <label class="block text-slate-500 uppercase tracking-wider mb-1.5">Diit (Jenis Diet) *</label>
                            <input type="text" id="inp-diet" required class="w-full px-3.5 py-2.5 border rounded-xl outline-none focus:ring-2 focus:ring-teal-500" placeholder="Contoh: Diet Rendah Garam, Diet DM">
                        </div>
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4 pt-2 border-t">
                        <div>
                            <label class="block text-slate-500 uppercase tracking-wider mb-1.5">Ahli Gizi / Penanggung Jawab *</label>
                            <input type="text" id="inp-petugas" required class="w-full px-3.5 py-2.5 border rounded-xl outline-none focus:ring-2 focus:ring-teal-500" placeholder="Alfebriati, S.Gz">
                        </div>
                        <div class="flex items-end gap-2">
                            <button type="button" onclick="bersihkanForm()" class="flex-1 bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold py-3 rounded-xl transition text-center">Batal</button>
                            <button type="submit" id="btn-submit-pasien" class="flex-1 bg-teal-800 hover:bg-teal-700 text-white font-bold py-3 rounded-xl shadow transition flex items-center justify-center gap-1.5">
                                <i data-lucide="user-check" class="w-4 h-4"></i>
                                <span>Simpan Pasien</span>
                            </button>
                        </div>
                    </div>
                </form>
            </div>

            <!-- TABEL DAFTAR MANIFES PASIEN AKTIF -->
            <div class="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm space-y-4">
                <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3 pb-3 border-b">
                    <h3 class="font-extrabold text-slate-800 text-sm uppercase tracking-wider flex items-center gap-1.5">
                        <i data-lucide="users" class="w-4.5 h-4.5 text-teal-600"></i> Daftar Pasien Rawat Inap Aktif
                    </h3>
                    <div class="flex gap-2">
                        <button onclick="pilihSemuaPasien(true)" class="text-xs font-bold text-teal-700 hover:text-teal-900 transition">Pilih Semua</button>
                        <span class="text-slate-300">|</span>
                        <button onclick="pilihSemuaPasien(false)" class="text-xs font-bold text-slate-500 hover:text-slate-700 transition">Batal Semua</button>
                    </div>
                </div>

                <div class="overflow-x-auto max-h-[380px] overflow-y-auto">
                    <table class="w-full text-left text-xs border-collapse">
                        <thead>
                            <tr class="bg-slate-50 text-slate-500 font-bold border-b sticky top-0 z-10">
                                <th class="py-2.5 px-3 text-center" style="width: 8%;">Cetak</th>
                                <th class="py-2.5 px-3">No. RM</th>
                                <th class="py-2.5 px-3">Nama Pasien</th>
                                <th class="py-2.5 px-3">Ruang Rawat</th>
                                <th class="py-2.5 px-3">Bentuk & Diit</th>
                                <th class="py-2.5 px-3 text-center">Tindakan</th>
                            </tr>
                        </thead>
                        <tbody id="manifes-pasien-body" class
