<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aplikasi Plisir Gizi 80x50 - RSUD Suryah Khairuddin</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        h1, h2, h3, .font-brand { font-family: 'Nunito', sans-serif; }
        
        /* UKURAN FISIK KOTAK LABEL: 80mm x 50mm */
        .label-print-block {
            width: 80mm;
            height: 50mm;
            box-sizing: border-box;
            padding: 3mm 4mm;
            background: #ffffff;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            page-break-after: always;
            break-after: page;
        }

        /* PENGATURAN CETAK / PRINT */
        @media print {
            body * { visibility: hidden; }
            #area-cetak, #area-cetak * { visibility: visible; }
            #area-cetak {
                position: absolute;
                left: 0;
                top: 0;
                width: 80mm;
                margin: 0;
                padding: 0;
            }
            @page {
                size: 80mm 50mm;
                margin: 0;
            }
        }
    </style>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen flex flex-col pb-8">

    <div id="toast-container" class="fixed top-5 right-5 z-50 flex flex-col gap-3"></div>

    <!-- HEADER -->
    <header class="bg-teal-800 text-white px-6 py-4 shadow-md">
        <div class="max-w-5xl mx-auto flex justify-between items-center">
            <div class="flex items-center gap-3">
                <div class="p-2 bg-teal-700 rounded-xl">
                    <i data-lucide="printer" class="w-6 h-6 text-white"></i>
                </div>
                <div>
                    <h1 class="text-base font-black tracking-tight uppercase">Plisir Gizi 80x50 mm</h1>
                    <span class="text-[10px] text-teal-300 font-bold uppercase">RSUD SURYAH KHAIRUDDIN</span>
                </div>
            </div>
            <span class="text-xs font-bold bg-teal-900/50 px-3 py-1.5 rounded-full border border-teal-700">Offline Ready</span>
        </div>
    </header>

    <main class="max-w-5xl mx-auto px-4 mt-6 grid grid-cols-1 lg:grid-cols-12 gap-6 w-full flex-1">
        
        <!-- FORM & TABEL (KIRI) -->
        <div class="lg:col-span-7 space-y-6">
            
            <!-- FORM INPUT -->
            <div class="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm space-y-4">
                <h3 class="font-extrabold text-slate-800 text-xs uppercase tracking-wider pb-2 border-b flex items-center gap-1.5">
                    <i data-lucide="user-plus" class="w-4 h-4 text-teal-600"></i> <span id="form-title">Tambah Pasien Baru</span>
                </h3>
                
                <form id="form-pasien" onsubmit="simpanPasien(event)" class="space-y-3 text-xs font-semibold">
                    <input type="hidden" id="edit-index" value="-1">

                    <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
                        <div>
                            <label class="block text-slate-500 mb-1">No. Rekam Medis (RM) *</label>
                            <input type="text" id="inp-rm" required class="w-full px-3 py-2 border rounded-xl outline-none focus:ring-2 focus:ring-teal-500" placeholder="RM-0000">
                        </div>
                        <div>
                            <label class="block text-slate-500 mb-1">Nama Lengkap Pasien *</label>
                            <input type="text" id="inp-nama" required class="w-full px-3 py-2 border rounded-xl outline-none focus:ring-2 focus:ring-teal-500" placeholder="Nama Pasien">
                        </div>
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-3 gap-3">
                        <div class="md:col-span-2">
                            <label class="block text-slate-500 mb-1">Ruang Rawat / Bangsal *</label>
                            <input type="text" id="inp-ruang" required class="w-full px-3 py-2 border rounded-xl outline-none focus:ring-2 focus:ring-teal-500" placeholder="Penyakit Dalam / VIP">
                        </div>
                        <div>
                            <label class="block text-slate-500 mb-1">Tgl Lahir / Umur *</label>
                            <input type="text" id="inp-tgl" required class="w-full px-3 py-2 border rounded-xl outline-none focus:ring-2 focus:ring-teal-500" placeholder="12-04-1975 atau 50 Th">
                        </div>
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
                        <div>
                            <label class="block text-slate-500 mb-1">Bentuk Makanan *</label>
                            <select id="inp-bentuk" required class="w-full px-3 py-2 border rounded-xl outline-none bg-white">
                                <option value="Makanan Biasa">Makanan Biasa (Nasi)</option>
                                <option value="Makanan Lunak" selected>Makanan Lunak (Bubur/Tim)</option>
                                <option value="Makanan Saring">Makanan Saring</option>
                                <option value="Makanan Cair">Makanan Cair (Enteral)</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-slate-500 mb-1">Jenis Diit *</label>
                            <input type="text" id="inp-diet" required class="w-full px-3 py-2 border rounded-xl outline-none focus:ring-2 focus:ring-teal-500" placeholder="Diet Rendah Garam, DM, dll">
                        </div>
                    </div>

                    <div class="flex gap-2 pt-2 border-t">
                        <button type="button" onclick="resetForm()" class="px-4 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold rounded-xl">Batal</button>
                        <button type="submit" id="btn-submit" class="flex-1 bg-teal-800 hover:bg-teal-700 text-white font-bold py-2 rounded-xl shadow flex items-center justify-center gap-1">
                            <i data-lucide="check" class="w-4 h-4"></i> Simpan Pasien
                        </button>
                    </div>
                </form>
            </div>

            <!-- TABEL MANIFES -->
            <div class="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm space-y-3">
                <div class="flex justify-between items-center pb-2 border-b">
                    <h3 class="font-extrabold text-slate-800 text-xs uppercase tracking-wider flex items-center gap-1.5">
                        <i data-lucide="users" class="w-4 h-4 text-teal-600"></i> Daftar Pasien Aktif
                    </h3>
                    <div class="flex gap-2 text-xs">
                        <button onclick="pilihSemua(true)" class="font-bold text-teal-700">Pilih Semua</button>
                        <span>|</span>
                        <button onclick="pilihSemua(false)" class="font-bold text-slate-500">Batal</button>
                    </div>
                </div>

                <div class="overflow-x-auto max-h-[300px] overflow-y-auto">
                    <table class="w-full text-left text-xs border-collapse">
                        <thead>
                            <tr class="bg-slate-50 text-slate-500 font-bold border-b sticky top-0">
                                <th class="p-2 text-center w-10">Cetak</th>
                                <th class="p-2">RM & Nama</th>
                                <th class="p-2">Ruang</th>
                                <th class="p-2">Diit</th>
                                <th class="p-2 text-center w-16">Aksi</th>
                            </tr>
                        </thead>
                        <tbody id="tabel-pasien" class="divide-y divide-slate-100 font-medium"></tbody>
                    </table>
                </div>
            </div>
        </div>

        <!-- PRATINJAU & CETAK (KANAN) -->
        <div class="lg:col-span-5 space-y-6">
            <div class="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm flex flex-col items-center space-y-4">
                <div class="flex justify-between items-center border-b pb-2 w-full text-xs">
                    <h3 class="font-extrabold text-slate-700 uppercase tracking-wider">Pratinjau Label (80x50 mm)</h3>
                    <span class="font-bold bg-teal-50 text-teal-800 px-2.5 py-1 rounded-full border border-teal-200" id="lbl-total">0 Terpilih</span>
                </div>

                <!-- TOMBOL EKSEKUSI CETAK UTAMA -->
                <button onclick="window.print()" class="w-full bg-slate-900 hover:bg-slate-800 text-white font-extrabold py-3.5 px-4 rounded-xl shadow-md transition flex items-center justify-center gap-2 text-xs">
                    <i data-lucide="printer" class="w-4 h-4 text-teal-400"></i>
                    <span>CETAK LABEL SEKARANG (Printer / Bluetooth)</span>
                </button>

                <!-- KONTAINER PREVIEW -->
                <div class="border border-slate-300 rounded-xl bg-slate-200 p-4 max-h-[420px] overflow-y-auto w-full flex flex-col items-center">
                    <div id="area-cetak" class="w-[80mm] flex flex-col gap-4">
                        <!-- Label dirender otomatis di sini -->
                    </div>
                </div>
            </div>

            <!-- CADANGAN DATA (JSON) -->
            <div class="bg-white p-4 rounded-2xl border border-slate-200 shadow-sm flex justify-between items-center text-xs">
                <button onclick="eksporData()" class="px-3 py-2 bg-slate-100 hover:bg-slate-200 font-bold rounded-xl border flex items-center gap-1">
                    <i data-lucide="download" class="w-3.5 h-3.5"></i> Ekspor Data
                </button>
                <label class="px-3 py-2 bg-slate-100 hover:bg-slate-200 font-bold rounded-xl border flex items-center gap-1 cursor-pointer">
                    <i data-lucide="upload" class="w-3.5 h-3.5"></i> Impor Data
                    <input type="file" accept=".json" class="hidden" onchange="imporData(event)">
                </label>
            </div>
        </div>
    </main>

    <script>
        let dbPasien = JSON.parse(localStorage.getItem("db_plisir_gizi")) || [];

        window.onload = function() {
            renderTabel();
            renderPreview();
            if (typeof lucide !== 'undefined') lucide.createIcons();
        };

        function showToast(msg) {
            const container = document.getElementById("toast-container");
            const toast = document.createElement("div");
            toast.className = "bg-slate-900 text-white px-4 py-2.5 rounded-xl shadow-lg text-xs font-bold transition-all";
            toast.innerText = msg;
            container.appendChild(toast);
            setTimeout(() => toast.remove(), 2500);
        }

        function simpanPasien(e) {
            e.preventDefault();
            const idx = document.getElementById("edit-index").value;
            const data = {
                rm: document.getElementById("inp-rm").value.trim().toUpperCase(),
                nama: document.getElementById("inp-nama").value.trim().toUpperCase(),
                ruang: document.getElementById("inp-ruang").value.trim().toUpperCase(),
                tgl: document.getElementById("inp-tgl").value.trim(),
                bentuk: document.getElementById("inp-bentuk").value,
                diet: document.getElementById("inp-diet").value.trim().toUpperCase(),
                selected: true
            };

            if (idx === "-1") {
                dbPasien.push(data);
                showToast("Pasien berhasil ditambahkan!");
            } else {
                data.selected = dbPasien[idx].selected;
                dbPasien[idx] = data;
                showToast("Data pasien diperbarui!");
            }

            simpanDanPerbarui();
            resetForm();
        }

        function simpanDanPerbarui() {
            localStorage.setItem("db_plisir_gizi", JSON.stringify(dbPasien));
            renderTabel();
            renderPreview();
        }

        function renderTabel() {
            const tbody = document.getElementById("tabel-pasien");
            if (dbPasien.length === 0) {
                tbody.innerHTML = `<tr><td colspan="5" class="py-6 text-center text-slate-400 font-bold bg-white">Belum ada pasien terdaftar.</td></tr>`;
                return;
            }

            tbody.innerHTML = dbPasien.map((p, i) => `
                <tr class="hover:bg-slate-50 border-b bg-white">
                    <td class="p-2 text-center">
                        <input type="checkbox" onchange="togglePilih(${i})" ${p.selected ? 'checked' : ''} class="w-4 h-4 text-teal-600 rounded cursor-pointer">
                    </td>
                    <td class="p-2">
                        <div class="font-extrabold text-slate-900">${p.nama}</div>
                        <div class="text-[10px] text-teal-700 font-mono font-bold">${p.rm}</div>
                    </td>
                    <td class="p-2 font-semibold">${p.ruang}</td>
                    <td class="p-2">
                        <div class="font-bold">${p.bentuk}</div>
                        <div class="text-[10px] text-slate-500">${p.diet}</div>
                    </td>
                    <td class="p-2 text-center">
                        <button onclick="editPasien(${i})" class="p-1 bg-amber-50 text-amber-700 rounded border border-amber-200 mr-1"><i data-lucide="pencil" class="w-3 h-3"></i></button>
                        <button onclick="hapusPasien(${i})" class="p-1 bg-rose-50 text-rose-700 rounded border border-rose-200"><i data-lucide="trash-2" class="w-3 h-3"></i></button>
                    </td>
                </tr>
            `).join('');
            if (typeof lucide !== 'undefined') lucide.createIcons();
        }

        function renderPreview() {
            const container = document.getElementById("area-cetak");
            const terpilih = dbPasien.filter(p => p.selected);
            document.getElementById("lbl-total").innerText = `${terpilih.length} Terpilih`;

            if (terpilih.length === 0) {
                container.innerHTML = `<div class="p-6 text-center text-slate-400 text-xs italic">Centang pasien di tabel untuk melihat pratinjau cetak.</div>`;
                return;
            }

            container.innerHTML = terpilih.map(p => `
                <div class="label-print-block bg-white text-slate-900 border border-slate-300 rounded shadow-sm flex flex-col justify-between">
                    <!-- KOP -->
                    <div class="flex items-center gap-2 border-b border-black pb-1 mb-1">
                        <div class="w-7 h-7 bg-teal-800 rounded flex items-center justify-center text-white font-black text-xs">GZ</div>
                        <div class="leading-tight">
                            <h4 class="font-extrabold text-[8px] uppercase text-slate-700">INSTALASI GIZI</h4>
                            <h4 class="font-black text-[11px] uppercase text-slate-950">RSUD SURYAH KHAIRUDDIN</h4>
                        </div>
                    </div>
                    
                    <!-- ISI DATA (Nama PJ Gizi dihapus bersih) -->
                    <div style="font-size: 10px; line-height: 1.25;" class="flex-1 flex flex-col justify-center space-y-0.5 font-semibold">
                        <div class="flex"><span style="width: 25mm;" class="text-slate-600">NAMA</span><span>:</span><span class="font-black flex-1 truncate text-[11px] ml-1">${p.nama}</span></div>
                        <div class="flex"><span style="width: 25mm;" class="text-slate-600">NO. RM</span><span>:</span><span class="font-bold font-mono flex-1 ml-1">${p.rm}</span></div>
                        <div class="flex"><span style="width: 25mm;" class="text-slate-600">RUANG</span><span>:</span><span class="font-bold flex-1 truncate ml-1 uppercase">${p.ruang}</span></div>
                        <div class="flex"><span style="width: 25mm;" class="text-slate-600">TGL/UMUR</span><span>:</span><span class="font-bold flex-1 ml-1">${p.tgl}</span></div>
                        <div class="flex"><span style="width: 25mm;" class="text-slate-600">BENTUK</span><span>:</span><span class="font-black text-teal-900 flex-1 ml-1">${p.bentuk.toUpperCase()}</span></div>
                        <div class="flex"><span style="width: 25mm;" class="text-slate-600">DIIT</span><span>:</span><span class="font-black text-slate-950 flex-1 ml-1 truncate">${p.diet}</span></div>
                    </div>
                    
                    <!-- FOOTER -->
                    <div class="border-t border-black/30 pt-1 text-center text-[8px] font-bold italic text-slate-700">
                        "Selamat menikmati & semoga lekas sembuh"
                    </div>
                </div>
            `).join('');
        }

        function togglePilih(i) {
            dbPasien[i].selected = !dbPasien[i].selected;
            simpanDanPerbarui();
        }

        function pilihSemua(status) {
            dbPasien.forEach(p => p.selected = status);
            simpanDanPerbarui();
        }

        function editPasien(i) {
            const p = dbPasien[i];
            document.getElementById("edit-index").value = i;
            document.getElementById("inp-rm").value = p.rm;
            document.getElementById("inp-nama").value = p.nama;
            document.getElementById("inp-ruang").value = p.ruang;
            document.getElementById("inp-tgl").value = p.tgl;
            document.getElementById("inp-bentuk").value = p.bentuk;
            document.getElementById("inp-diet").value = p.diet;
            document.getElementById("form-title").innerText = "Edit Data Pasien";
            document.getElementById("btn-submit").innerHTML = `<i data-lucide="check" class="w-4 h-4"></i> Perbarui Pasien`;
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function hapusPasien(i) {
            if (confirm("Hapus pasien ini dari manifes?")) {
                dbPasien.splice(i, 1);
                simpanDanPerbarui();
                showToast("Pasien dihapus.");
            }
        }

        function resetForm() {
            document.getElementById("form-pasien").reset();
            document.getElementById("edit-index").value = "-1";
            document.getElementById("form-title").innerText = "Tambah Pasien Baru";
            document.getElementById("btn-submit").innerHTML = `<i data-lucide="check" class="w-4 h-4"><span> Simpan Pasien`;
        }

        function eksporData() {
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(dbPasien));
            const a = document.createElement('a');
            a.href = dataStr;
            a.download = "backup_plisir_gizi.json";
            a.click();
        }

        function imporData(e) {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(evt) {
                try {
                    dbPasien = JSON.parse(evt.target.result);
                    simpanDanPerbarui();
                    showToast("Data berhasil diimpor!");
                } catch (err) {
                    showToast("Format file salah!");
                }
            };
            reader.readAsText(file);
        }
    </script>
</body>
</html>
